name: Build OnePlus 5T (LineageOS 22.2 A15)

on:
  workflow_call:
  workflow_dispatch:

env:
  # Device env
  DEVICE_NAME: "oneplus_5t"
  DEVICE_CODENAME: "dumpling"

  CUSTOM_CMDS: "CLANG_TRIPLE=aarch64-linux-gnu-"
  EXTRA_CMDS: "LD_LIBRARY_PATH=$GITHUB_WORKSPACE/clang-custom/lib64"

  KERNEL_SOURCE: "https://github.com/LineageOS/android_kernel_oneplus_msm8998.git"
  KERNEL_BRANCH: "lineage-22.2"

  CLANG_SOURCE: "https://github.com/LineageOS/android_prebuilts_clang_kernel_linux-x86_clang-r416183b.git"
  CLANG_BRANCH: "lineage-20.0"

  GCC_GNU : true # GNU binutils from apt (aarch64-linux-gnu- / arm-linux-gnueabi-)
  GCC_64_SOURCE: ""
  GCC_64_BRANCH: ""
  GCC_32_SOURCE: ""
  GCC_32_BRANCH: ""

  DEFCONFIG_SOURCE: ""
  DEFCONFIG_NAME: "lineage_oneplus5_defconfig" # shared by OnePlus 5 (cheeseburger) and 5T (dumpling)
  DEFCONFIG_ORIGIN_IMAGE: ""
  DEFCONFIG_FROM_BOOT: false

  # KernelSU-Next legacy branch with the 4.4 build fixes
  KERNELSU_SOURCE : "https://github.com/prajendr71/KernelSU-Next.git"
  KERNELSU_BRANCH : "legacy"

  KERNELSU_AUTO_GET : "false" # if u want easy setting kernelsu, u can true.
  KERNELSU_AUTO_FORK : "next" # xxksu, rsuntk, next, bakasu and sukisu

  SUSFS_ENABLE : false # KernelSU-Next legacy + SUSFS is not supported by this pipeline
  SUSFS_FIXED : false

  AK3_SOURCE : "https://github.com/osm0sis/AnyKernel3.git"
  AK3_BRANCH : "master"

  BOOT_SOURCE : ""

  NEED_DTBO : false
  NEED_SAFE_DTBO : false

  ROM_TEXT: "lineageos22_2_a15"

  # Other env
  PYTHON_VERSION: "3" # Only 2(Ubuntu 22.04 and Ubuntu 20.04) or 3(Any OS Versions).

  PACK_METHOD: "AnyKernel3" # Anykernel3 need SOURCE and BRANCH, MKBOOTIMG needn't it.
  PACK_KMODULES: "false" # if u want pack kernel modules (.ko) into Anykernel3.

  KERNELSU_METHOD: "manual" # shell, manual and only.

  PATCHES_SOURCE: "JackA1ltman/NonGKI_Kernel_Patches" # [your_name]/[your_patch] -> gooder123/NonGKI_Patcher
  PATCHES_BRANCH: "main" # [your_branch] -> main

  SUSFS_FOLDER_FIXED: "" # Fill in your patch prefix directory here. Leave it blank if there isn't one. -> your_folder
  SUSFS_PATCH_FIXED: "" # Fill in your patches here. If there are multiple patches, please separate them with a comma. Leave it blank if there isn't one. -> patch1,patch2

  REKERNEL_ENABLE: "false" # if u need Re:Kernel.
  DROIDSPACES_ENABLE: "false" # if u need Droidspaces or LXC/Docker.
  NOMOUNT_ENABLE: "false" # if u need NoMount.
  FGETPRIORITY_ENABLE: "false" #if u need hide getpriority.
  VPNHIDE_ENABLE: "false" #if u need hide vpn status.

  HOOK_METHOD: "syscall" # Manual hook method -> syscall.

  KPM_ENABLE: "false" # Anyone devices.
  KPM_INLINE: "false" # Only use it for SukiSU-Ultra.
  KPM_KPATCH_NEXT: "false" # If u want hook KPatch-Next in build step.
  KPM_PATCH_SOURCE: "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU_patch/refs/heads/main/kpm/patch_linux" # If u want to use KPM Inline,so you need set patch exec file source -> raw.githubusercontent.com/Test/Test/patch .

  BASEBAND_GUARD_ENABLE: "false" #if u want prevent unauthorized writes to critical partitions/device nodes.
  BASEBAND_GUARD_BOOT: "false" #if u want to protect boot partition.

  GENERATE_DTB: "false" # if u kernel need DTB , but cannot auto generate it. (Only Anykernel3).
  GENERATE_CHIP: "qcom" # only supported for qcom and mediatek.

  BUILD_DEBUGGER: "false" # Output build errors.
  SKIP_PATCH: "false" # Ignore errors found in Patch Debugger.

  BUILD_OTHER_CONFIG: "false" # Merge config files.
  MERGE_CONFIG_FILES: ""

  FREE_MORE_SPACE: "false" # if u want get more space, enabled it.

jobs:
  build-kernel:
    name: OnePlus 5T (LineageOS 22.2 A15)
    runs-on: ubuntu-22.04
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"

    steps:
      - name: ⏰ Checkout repository
        uses: actions/checkout@v6

      - name: ⌛️ Compilation environment preparation
        uses: ./.github/workflows/build-env

      - name: ⚙️ Get neccssary tools
        uses: ./.github/workflows/build-ready

      - name: 🪝 Patch Kernel of SUSFS
        uses: ./.github/workflows/patch-susfs

      - name: 🔗 Patch for no-kprobe
        uses: ./.github/workflows/patch-no-kprobe

      - name: 🪛 Extra Kernel Options
        run: |
          # Only ${{ env.DEVICE_NAME }} use it.
          cd $GITHUB_WORKSPACE/device_kernel

          # The generic syscall hook script targets several KernelSU forks; some of
          # its call signatures (sys_read, setresuid) don't match KernelSU-Next
          # legacy. Swap them for the OnePlus 5T hook patch that was build-tested
          # against this exact kernel and KernelSU-Next branch. It contains the
          # same check_nnp_nosuid SELinux fix the generic script adds.
          git checkout -- fs/exec.c fs/open.c fs/read_write.c fs/stat.c \
            kernel/reboot.c kernel/sys.c drivers/input/input.c \
            security/selinux/hooks.c security/selinux/ss/services.c
          curl -fsSL "https://raw.githubusercontent.com/prajendr71/KernelSU-Next/legacy/dumpling/0001-kernelsu-next-manual-hooks.patch" -o /tmp/ksu-dumpling-hooks.patch
          git apply --exclude='arch/*' /tmp/ksu-dumpling-hooks.patch
          grep -q "CONFIG_KSU_MANUAL_HOOK=y" "arch/${KERNEL_ARCH}/configs/${DEFCONFIG_NAME}" || \
            echo "CONFIG_KSU_MANUAL_HOOK=y" >> "arch/${KERNEL_ARCH}/configs/${DEFCONFIG_NAME}"
          echo "[+] Applied OnePlus 5T KernelSU-Next hooks."

      - name: 🧰 Patch Kernel of Re:Kernel
        uses: ./.github/workflows/patch-rekernel

      - name: 💿 Patch Kernel of Droidspaces
        uses: ./.github/workflows/patch-droidspaces

      - name: 🔒 Patch Kernel of Baseband Guard
        uses: ./.github/workflows/patch-baseband-guard

      - name: 🛡️ Patch Kernel of NoMount
        uses: ./.github/workflows/patch-nomount

      - name: ⛔ Patch Kernel of fgetpriority
        uses: ./.github/workflows/patch-fgetpriority

      - name: 🛜 Patch Kernel of VPNHide
        uses: ./.github/workflows/patch-vpnhide

      - name: 🚀 Build Process
        uses: ./.github/workflows/build-process

      - name: 🔩 Pack Process
        uses: ./.github/workflows/pack-process

      - name: ✏️ Upload Artifacts
        uses: ./.github/workflows/upload-files
